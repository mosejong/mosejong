name: Publish resume PDF

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/generate_resume.py'
      - '.github/workflows/publish-resume.yml'
      - 'assets/증명사진.jpg'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum fonts-noto-mono

      - name: Install PDF dependency
        run: python -m pip install --upgrade reportlab

      - name: Build latest resume PDF
        run: python .github/scripts/generate_resume.py

      - name: Point resume links to latest PDF
        run: |
          sed -i 's#\./assets/모세종\.pdf#./assets/모세종_이력서.pdf#g' README.md resume.html
          rm -rf _resume_upload

      - name: Commit generated resume
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md resume.html assets/모세종_이력서.pdf .github/scripts/generate_resume.py .github/workflows/publish-resume.yml
          git add -A _resume_upload 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'docs: publish latest resume and fix resume links'
            git push
          fi
